# prova's own test suite (proof-driven development of prova, by prova).
[run]
proofs       = ["proofs"]            # dir-name pattern: every `proofs/` below the root (the default)
config       = ".prova/config.lua"    # the runtime companion, tucked into the .prova/ nook
packages     = ".prova/packages"     # this project's own local packages (root-relative). No
                                     # default, and exactly one: anything from elsewhere gets a
                                     # name and a pinned source in [dependencies] instead.

# The `parallels` package now lives in its own repo, consumed here as a pinned git source — exactly
# as any package would, which is the whole point of the extraction. It was incubated in-tree under
# .prova/packages/parallels; that copy is retired. Pinned to the released `v1` tag.
[dependencies]
parallels = { git = "https://github.com/prova-rs/prova-parallels", tag = "v1" }

# The heavy, cargo-based quality gates (clippy, unwrap/expect census under proofs/quality/) are
# opt-in: each recompiles the workspace, so they never run in the default `prova` loop — they
# `requires = { "quality" }`, a capability that stays false unless PROVA_QUALITY is set. This profile
# sets it and `must_run`s it, so `prova --profile quality` (and CI's quality leg) runs them and they
# cannot silently skip. `proofs = ["quality"]` scopes the profile to the proofs/quality/ dir (a
# dir-name pattern, like the default ["proofs"]), so `prova --profile quality` runs exactly the
# gates — the fast file-size gate included — and nothing else.
[profiles.quality]
proofs   = ["quality"]
must_run = ["quality"]
[profiles.quality.env]
PROVA_QUALITY = "1"

# The code-quality dials — prova holding its own code to the bar it enforces for others. `posture`
# is the observe<->enforce ladder: `enforce` (the default) makes a violated gate FAIL the run (a
# proof); `observe` makes it SURFACE without failing (a reminder) — `prova --profile quality
# --observe` shows the whole picture without gating (the onboarding/vibe rung). `max_file_lines` is
# read by the file-size gate; the current giants (modules.rs/engine.rs/main.rs) are grandfathered
# above it and tracked for paydown. Language-agnostic: these knobs know nothing about Rust.
[quality]
posture        = "enforce"
max_file_lines = 1500

# Prova's own claims. The point of declaring this is not bookkeeping — it is that prova must be
# the exemplar of a proven application, and a lifecycle nobody has run end-to-end on a real
# project is a design rather than a practice. Anchors live in the design docs; `prova owed` says
# what is still owed against them. See docs/design/lifecycle.md.
[claims]
docs = ["docs/design"]

# This repo's /.luarc.json is deliberately COMMITTED and hand-maintained (it points at library/ —
# the hand-written stub sources, because prova is where they come from). prova's own managed
# entries are machine-local absolute paths, which would keep the tracked file dirty on every
# contributor's machine — so the pointer is hands-off here. Annotations still sync to the shared
# cache; only the pointer is unmanaged.
[luals]
manage = "never"

# Topologies this project exposes by name (`prova up <name>`). `vm` comes from the `parallels`
# package's advertisement; its `requires = ["prlctl"]` gates the stand-up, so on a machine without
# Parallels Desktop `prova up vm` skips cleanly instead of failing. `options` is handed to the
# factory (`vm(ctx, { image = … })`) — the base template it linked-clones. Set `image` to a
# template that exists in your Parallels library.
[topologies]
vm = { package = "parallels", topology = "vm", options = { image = "ubuntu-24.04" } }
