# prova's own test suite (proof-driven development of prova, by prova).

# The self-hosting trampoline (docs/design/manifest.md#manifest-declared-runner): ANY prova
# invoked in this repo — installed, stale, someone else's build — provisions this tree's binary
# and re-execs through it. Freshness and identity are mechanism now; the old "never prove through
# an installed prova" prose is retired. Invoking target/debug/prova directly skips the hop (you
# named the artifact; you meant it).
[runner]
build   = "cargo build -q -p prova-cli"
bin     = "target/debug/prova"
# The build's input roots: while nothing under these is newer than the last provision, the hop
# skips the no-op cargo build (~3.5s of dep-graph fingerprinting) — a ~15ms sweep instead.
sources = ["crates", "xtask", "library", "Cargo.toml", "Cargo.lock", ".config"]

[run]
proofs       = ["proofs"]            # dir-name pattern: every `proofs/` below the root (the default)
config       = ".prova/config.lua"    # the runtime companion, tucked into the .prova/ nook
packages     = ".prova/packages"     # this project's own local packages (root-relative). No
                                     # default, and exactly one: anything from elsewhere gets a
                                     # name and a pinned source in [dependencies] instead.

# The `parallels` package now lives in its own repo, consumed here as a pinned git source — exactly
# as any package would, which is the whole point of the extraction. It was incubated in-tree under
# .prova/packages/parallels; that copy is retired. Pinned to the released `v1` tag.
[dependencies]
parallels = { git = "https://github.com/prova-rs/prova-parallels", tag = "v1" }

# The heavy, cargo-based quality gates (clippy, unwrap/expect census under proofs/quality/) sit
# behind the `quality` switch — each recompiles the workspace, so they never run in the default
# `prova` loop (docs/design/manifest.md#switches-not-env-capabilities). This profile scopes to the
# proofs/quality/ dir (positive selection: nothing else can creep in) and throws the switch; the
# fast file-size gate in the same dir carries no switch, so it runs in the default loop too.
# Ad hoc: `prova -s quality -k clippy`.
[profiles.quality]
description = "code-quality gates: clippy -D warnings, the unwrap/expect ratchet, file-size limits (recompiles the workspace)"
proofs      = ["quality"]
switches    = ["quality"]

# The deputed unit-test leg: `prova run ut` conducts `cargo nextest` ONCE (a file-scoped fixture
# compiles + runs the workspace's unit tests, emitting junit), adopts every case into the account,
# and case-granular readers bind claims to named unit tests — the conduct-once-read-many pattern
# (docs/design/verifiers.md#conduct-once-read-many). The whole leg sits behind the `ut` switch
# (proofs/ut/suite.lua) for the same reason as `quality` (conducting compiles); `must_run` keeps
# the WORLD fact, so under this profile a missing nextest FAILS rather than skips — `prova run ut`
# is a contract, not a courtesy.
[profiles.ut]
description = "the workspace's unit tests, conducted once via cargo nextest and adopted into the account (deputed junit)"
proofs      = ["ut"]
switches    = ["ut"]
must_run    = ["cargo-nextest"]

# Code coverage, ratcheted: conducts `cargo llvm-cov nextest` (an instrumented rebuild + run of
# the workspace's unit tests) and holds the line-coverage total to the committed baseline in
# .prova/baselines/quality.json — regressions are red, and a new floor is raised deliberately via
# `prova run coverage --update-baseline`. Not part of `all`: the instrumented rebuild roughly
# doubles the sweep; CI gives coverage its own leg.
[profiles.coverage]
description = "layered coverage, ratcheted: unit (nextest) + black-box (the instrumented suite) + the whole-bar merge, with the unit-owed delta worklist"
proofs      = ["coverage"]
switches    = ["coverage"]
must_run    = ["cargo-llvm-cov", "cargo-nextest"]

# Everything short of the soaks, one command: the whole black-box suite PLUS the switched heavy
# legs — unit tests deputed via nextest, the cargo quality gates. The pre-push answer to "did I
# break anything big?": slower than bare `prova`, far faster than waiting for CI, and one exit
# code for all of it. Soaks stay ad-hoc (`-s soak`) — hours never ride a sweep.
[profiles.all]
description = "the pre-push sweep: every black-box proof plus the ut and quality legs (soaks stay out)"
switches    = ["ut", "quality"]
must_run    = ["cargo-nextest"]

# Prova's own specs — the prose layer. The point of declaring this is not bookkeeping — it is that
# prova must be the exemplar of a proven application, and a lifecycle nobody has run end-to-end on a
# real project is a design rather than a practice. Claim and backlog anchors live in the design
# docs; `prova owed` says what is still owed against them. See docs/design/lifecycle.md.
[[specs.source]]
type = "directory"
path = "docs/design"

# This repo's /.luarc.json is deliberately COMMITTED and hand-maintained (it points at library/ —
# the hand-written stub sources, because prova is where they come from). prova's own managed
# entries are machine-local absolute paths, which would keep the tracked file dirty on every
# contributor's machine — so the pointer is hands-off here. Annotations still sync to the shared
# cache; only the pointer is unmanaged.
[luals]
manage = "never"

# Topologies this project exposes by name (`prova up <name>`). `vm` comes from the `parallels`
# package's advertisement; its `requires = ["prlctl"]` gates the stand-up, so on a machine without
# Parallels Desktop `prova up vm` skips cleanly instead of failing. `options` is handed to the
# factory (`vm(ctx, { image = … })`) — the base template it linked-clones. Set `image` to a
# template that exists in your Parallels library.
[topologies]
vm = { package = "parallels", topology = "vm", options = { image = "ubuntu-24.04" } }
