[package]
name = "prova-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mlua = { workspace = true, features = ["async"] }
# Async from the ground up: a per-run current-thread runtime drives many concurrent Lua
# coroutines cooperatively (I/O-bound concurrency for load/stress; real timeouts via cancellation).
# `process` powers `shell`; `io-util` is its runtime dep for child pipes; `net` is the `docker`
# module's TCP readiness probe.
tokio = { version = "1", features = ["rt", "time", "macros", "process", "io-util", "net", "signal"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# Structured, streaming output for machine consumers (CI, and a future GUI/IDE frontend).
serde_json = "1"
# RFC3339 `timestamp` attribute on the JUnit `<testsuite>` — zero-dep, no chrono/time pull.
humantime = "2"
# Reading a plugin's own `prova.toml` at resolve time, for its private `[plugins]` dependency
# map. The searcher needs this because local plugins (`.prova/plugins/*`) are discovered here, never
# passing through the CLI's manifest resolution — so their declared deps have nowhere else to come from.
toml = "0.8"
# Filesystem globbing for the `fs` module (fs.glob(root, "**/*.rs")).
glob = "0.3"
# `[capabilities] pattern = "..."` — picking a version out of a tool's output when the
# first-version-shaped-token heuristic can't (`kubectl version --client`, `terraform version -json`).
# Already in the graph transitively; this is a declaration, not new weight.
regex = "1"
# The `junit` module (docs/design/verifiers.md) — JUnit XML is the de facto lingua franca of
# test results, and its escaping/entity rules are the classic place to hand-roll a quiet bug.
quick-xml = "0.37"
# The `csv` module (api-freeze §1) — RFC 4180 quoting is a well-known place to introduce a quiet
# bug for no benefit (same reasoning as form_urlencoded below), so the parsing/quoting is a crate.
csv = "1"
# The utility belt (api-freeze §1): `base64`, `hash.{sha256,hmac_sha256}`, `uuid.v4`, `url`.
# Every one of these is already compiled into the binary transitively (reqwest/bollard/sqlx pull
# them) — these are declarations, not new weight. `percent-encoding` backs `url.encode` (component
# encoding, `%20` not `+` — form_urlencoded is the wrong shape for path/query components).
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
# Home-directory discovery for the XDG SystemLayout (config/cache/data dirs). Light, no transitive
# weight; only used to locate `~` — the XDG_* env vars and path joins are done by hand.
dirs = "5"
# The terminal kernel (docs/design/terminal-kernel.md): pty allocation behind one API — openpty on
# unix, ConPTY on Windows — a VT-sequence screen model as the observation layer, and every wait as a
# non-blocking check. The `terminal` module is its Lua face; the crate is published on its own so a
# host outside prova (Substrate's cos.process.pty_*) drives the same kernel.
prova-terminal = { path = "../prova-terminal" }
# flock (locks, barrier), liveness probes and process-group kills (scratch, lease), and the macOS
# rusage reader (shell's CPU-liveness) — already in the graph via tokio, a declaration, not new
# weight.
libc = "0.2"
# The `websocket` kernel transport: full-duplex message turns over the http upgrade path.
# `ws://` and — with the `tls` feature — `wss://`; the protocol frames messages natively, so unlike
# raw `socket` there is no framing strategy to choose.
#
# `__rustls-tls` rather than tungstenite's own `rustls-tls-*-roots`: those pull webpki-roots **0.26**
# while the rest of this graph is on **1.x**, so taking them would compile a second copy of Mozilla's
# root bundle that nothing reads — prova builds the `ClientConfig` itself (modules/tls.rs) and hands
# it over as an explicit `Connector`, which is also what makes one root policy serve all three
# transports rather than three that drift.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
# The `http` module (and `graphql`, which shares the client). TLS arrives via the `tls` feature
# below rather than `default-tls`: native-tls would put OpenSSL and a C toolchain between prova and
# its single-static-binary promise. Feature-gated so builds can opt out.
reqwest = { version = "0.12", optional = true, default-features = false }
# The `sqlite` module — one general Connection API over sqlx's `Any` driver (backend chosen by URL
# scheme). Heavy, so feature-gated (default on). **No TLS, and that is not a gap**: only the
# `sqlite` feature is compiled here, and a file/memory database has no network layer to secure.
# Server databases are external docker-exec packages driving `psql`/`mysql` inside a container,
# where TLS is that CLI's argument to take (docs/design/architecture.md#tls-everywhere).
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "runtime-tokio",
    "any",
] }
# The `docker` module — the typed Docker daemon client (bollard), not CLI-shelling: structured
# errors, log streams, exec, port inspection. Feature-gated (default on).
bollard = { version = "0.18", optional = true }
# The `grpc` module — a *native*, dynamic gRPC client (no `grpcurl` on PATH). It discovers the
# server's schema at runtime via gRPC Server Reflection (`tonic-reflection`'s client), builds request
# messages from Lua tables against the fetched descriptors (`prost-reflect`'s `DynamicMessage`), and
# invokes with a generic tonic codec. Versions track archetect-core's tonic/prost (0.14) so the
# workspace lockfile dedupes to a single build. TLS comes from the `tls` feature below, which adds
# tonic's `tls-ring` + both root sets. Feature-gated (default on).
#
# (The old note here claimed `prova-core` still builds `--no-default-features`. It does not, and not
# because of TLS: `tokio` is declared without `sync` while `wiretap.rs` uses `tokio::sync`
# unconditionally — captured as agent-ergonomics.md#no-default-features-build-is-broken.)
tonic = { version = "0.14", default-features = false, features = ["channel"], optional = true }
tonic-reflection = { version = "0.14", default-features = false, optional = true }
# `grpc.mock` — the server half. `tonic/server` brings the framing+trailers machinery (`server::Grpc`)
# and, importantly, does NOT pull axum: only tonic's `router` feature does, and we route by path
# ourselves. That matters because `UnaryService::Future` carries **no `Send` bound** (only the request
# body must be Send, and hyper's `Incoming` is), which is the one property that lets a **Lua** handler
# answer an RPC. `h2` is already in the graph via hyper, so this is close to free.
#
# `protox` compiles `.proto` at runtime, in pure Rust — no `protoc` on PATH, matching the client's
# "tests need no codegen" stance. A mock must know the schema it serves: the client learns it *from*
# the server by reflection, and that trick does not invert.
protox = { version = "0.9", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
prost-reflect = { version = "0.16.5", features = ["serde"], optional = true }
# The `yaml` module — parse YAML (k8s manifests, CI configs, compose files) to Lua values, the way
# `http`'s `:json()` does for JSON. General black-box-testing capability, not archetype-specific.
# Maintained serde_yaml fork. Feature-gated (default on); light, pure-Rust.
serde_yaml_ng = { version = "0.10.0", optional = true }
serde = { version = "1", features = ["derive"] }
# The `str` module's casing half — archetect's OWN inflections (same repo+tag as prova-archetect's
# archetect-core, so the lockfile dedupes to one copy). Calling archetect's implementation rather
# than reimplementing is the point: `str.snake_case` in a proof and `snake_case` in an archetype
# are the same function, so casing asserts on rendered output cannot drift from the renderer.
archetect-inflections = { git = "https://github.com/archetect/archetect.git", tag = "v3.5.0" }
# Capability version predicates — `requires = { "dotnet >= 9" }`. The constraint is real semver, not
# a hand-rolled compare: version ordering is exactly where "obviously correct" hand code is quietly
# wrong (prereleases, ranges, `^`). prova-cli already depends on semver for archetect's own
# `requires.archetect` gate, so the workspace resolves a single copy.
semver = "1"
# The `mock` facet (`http.mock`) — an in-process stub/record server for the dependency you can't run.
#
# **Raw hyper, deliberately not axum.** A stub's response may be a *Lua function*, and mlua handles
# are `!Send`, so the service future that calls one is `!Send`. axum (and anything tower-shaped)
# bounds its handlers `Send`, which rules it out at the type level — no amount of wrapping recovers
# it. hyper's `server::conn::http1` puts no `Send` bound on the service or its future, so the
# connection future is driven on the engine's existing current-thread runtime via `spawn_local`,
# right next to the test coroutine it is answering. That constraint chose the dep.
#
# Cost is zero: every crate here is already compiled into this binary via bollard/tonic/reqwest, so
# this is a declaration, not a new stack. Feature-gated (default on) alongside `http`.
hyper = { version = "1", default-features = false, features = [
    "server",
    "http1",
], optional = true }
hyper-util = { version = "0.1", default-features = false, features = [
    "tokio",
], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
# Query-string parsing for a recorded request's `query` table, and the encoder behind `http`'s
# `form = { … }` body. Already compiled (reqwest → url → form_urlencoded); declared rather than
# hand-rolled because percent-encoding is a well-known place to introduce a quiet bug for no
# benefit — and a form body that encodes `+`/`&`/UTF-8 wrong fails at the far end of an OAuth
# exchange, where the error names none of that.
form_urlencoded = { version = "1", optional = true }
# The archive `docker.run`'s `files` streams into a created container (PUT /containers/{id}/archive
# takes a tar). Already compiled — bollard's own image-build path pulls it — and declared rather
# than hand-rolled because a tar header written by hand gets modes, parent entries and long paths
# subtly wrong, and the symptom is a container that boots with the wrong bytes.
tar = { version = "0.4", optional = true }
# The `tls` feature (docs/design/architecture.md#tls-everywhere) — one certificate policy behind
# `http`/`graphql`, `websocket` and `grpc`.
#
# **Every one of these is already compiled into this binary**, which is why TLS everywhere costs a
# declaration rather than a stack: archetect-core's octocrab pulls `hyper-rustls`, and its `tonic`
# already carries `tls-ring` + `tls-webpki-roots` — feature unification means prova-core's tonic is
# built with them today and simply never asked for TLS. `cargo tree -i rustls` is the receipt.
#
# Declared directly because prova constructs the `ClientConfig` for the transports whose crates do
# not expose one (`websocket`, and the custom verifier `insecure` needs on `grpc`). rustls' provider
# is named explicitly at that call site rather than left to `CryptoProvider::get_default()`: with two
# providers in a dep graph that function panics, so a crate elsewhere enabling `aws-lc-rs` would turn
# a working build into a startup crash with nothing in this tree to explain it.
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "ring",
    "std",
] }
rustls-pki-types = { version = "1", optional = true }
# Mozilla's bundle AND the platform store, together — a scratch CI container has no system trust at
# all, a laptop behind a TLS-inspecting proxy has a CA that exists nowhere else, and picking one
# breaks the other with a handshake error rather than a missing feature.
webpki-roots = { version = "1", optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[dev-dependencies]
# A cross-process file lock, for serializing the docker-heavy integration tests (tests/common/mod.rs).
# `cargo test` runs each test BINARY as its own process, in parallel, and `--test-threads` bounds only
# the threads WITHIN a binary — so all eight docker binaries pile onto one daemon at once and
# container starts time out. That is a recurring flake, not a logic failure (it times out; a real
# failure fails fast). Needs to be a crate rather than a raw flock because the CI matrix includes
# Windows.
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
# GetProcessTimes for the CPU-liveness reader (modules/shell.rs child_cpu_ticks) — the same
# native-API rule as procfs/libproc: never a `ps` dialect guess.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
default = ["http", "sqlite", "docker", "grpc", "graphql", "yaml", "mock", "grpc-mock", "tls"]
http = ["dep:reqwest", "dep:form_urlencoded"]
# `https://` · `wss://` · gRPC over TLS, with `insecure` and `ca_cert` spelled the same on all three
# (docs/design/architecture.md#tls-everywhere). **Default on**: what consumers get is `run-action`'s
# published binary, not a build they configured, so a released prova that cannot reach `https` makes
# the capability theoretical.
#
# Additive and independent of which transports are compiled — the `?/` forms are no-ops when their
# optional crate is absent, so `--no-default-features --features tls` is a coherent (if inert)
# build, and every transport-plus-tls pair works without a combinatorial feature list.
tls = [
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    "dep:rustls-native-certs",
    # Both root sets on the reqwest side too; reqwest's builder defaults both to enabled once their
    # features are on, and `add_root_certificate` ADDS to that store rather than replacing it —
    # which is exactly `ca_cert`'s documented meaning.
    "reqwest?/rustls-tls-webpki-roots",
    "reqwest?/rustls-tls-native-roots",
    # See the tokio-tungstenite comment above for why this is the private feature and not the
    # `rustls-tls-*-roots` pair (a duplicate webpki-roots 0.26 nothing would read).
    "tokio-tungstenite/__rustls-tls",
    "tonic?/tls-ring",
    "tonic?/tls-webpki-roots",
    "tonic?/tls-native-roots",
]
# The `mock` facet on protocol namespaces — `http.mock` today; `grpc.mock`/`net.mock` later. Implies
# `http`: a mock is asserted on through the same journal the `http` client's types already describe,
# and there is no coherent build with a mock server but no client to drive it.
mock = [
    "http",
    # Cassettes are serde-derived structs. `serde` is already compiled (reqwest), and `derive` is
    # additive for the `yaml` feature that also uses it.
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:bytes",
    "dep:form_urlencoded",
]
# `grpc.mock` — additive over `mock` + `grpc`. Separate from `mock` so a build can keep the HTTP mock
# (cheap: no new crates) without paying for protox and tonic's server stack.
grpc-mock = [
    "mock",
    "grpc",
    "dep:protox",
    "tonic/server",
    # tonic-reflection's generated server uses `tonic::codegen::*`. Serving reflection from the real
    # crate (rather than hand-rolling a bidi stream) is what makes `grpc.client(mock.url)` work with
    # no special case — and it composes because reflection never touches Lua, so its `Send` future is
    # free to be Send while the app-method path next to it is not.
    "tonic/codegen",
    "tonic-reflection/server",
    "hyper/http2",
]
# GraphQL over HTTP (POST { query, variables } → { data, errors }); shares reqwest with `http`.
graphql = ["dep:reqwest"]
# SQL databases — one namespace per engine (feature = namespace = global), all returning the same
# generic Connection over sqlx's `Any` driver.
sqlite = ["dep:sqlx", "sqlx/sqlite"]
docker = ["dep:bollard", "dep:tar"]
grpc = [
    "dep:tonic",
    "dep:tonic-reflection",
    "dep:prost",
    "dep:prost-types",
    "dep:prost-reflect",
]
yaml = ["dep:serde_yaml_ng"]

