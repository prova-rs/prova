[package]
name = "lib"
description = "A library package that privately depends on `inner`. Proves a package can bundle a dependency without exposing it to consumers (the bundled + isolated model)."

# This package's PRIVATE dependency map — declared exactly the way a consumer declares its packages
# in prova.toml [dependencies], so there is one surface to learn rather than two.
#
# `inner` resolves for THIS package's code and nowhere else: a consumer that requires `lib` gets
# `lib`, and `require("inner")` fails for them. That is what proofs/packages/isolation_test.lua pins.
#
# Note it lives INSIDE this package (deps/inner), not at the top of .prova/packages/. A top-level
# directory there is an ambient package and is globally requirable by design — putting a private
# dependency there would leak it to everyone, which is the very thing being prevented.
[dependencies]
inner = { path = "deps/inner" }
