name: Build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      # Surface every platform's failure in one run rather than cancelling siblings.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `pulsar`'s build script compiles .proto files and needs protoc on PATH. Runner images
      # do not ship it (a dev laptop usually has it via brew/apt, which is exactly how this
      # dependency stays invisible until CI).
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Rust Dependency Caching
        uses: Swatinem/rust-cache@v2

      # Prova's default features vendor and compile C libraries from source (mlua/Lua,
      # librdkafka). Building all three release platforms on every push means a
      # platform-specific toolchain break surfaces here, not at release time — release.yml
      # builds the same matrix and a red leg there blocks the Homebrew tap update.
      - name: Build
        run: cargo build

      - name: Test
        # --no-fail-fast: one run reports EVERY failing binary. Windows suites were being
        # discovered one 9-minute cycle at a time as each fail-fast stop unmasked the next.
        run: cargo test --no-fail-fast
        env:
          # Opt-in for the suites that bind 0.0.0.0 to prove the cross-substrate mock vantage
          # (mock_network_vantage, c2_e2e). Off by default so a local `cargo test` never trips the
          # macOS Application Firewall's "accept incoming connections?" prompt; CI runs them on
          # every leg. GitHub runners have the firewall disabled, so no prompt blocks the run.
          PROVA_TEST_NETWORK_VANTAGE: "1"
          # The prova runs under `cargo test` are FIXTURES, not this job's report. ~24 integration
          # tests spawn the binary through std::process::Command against a throwaway home, dozens of
          # times, and several are red on purpose. Each such child is a top-level prova as far as it
          # can tell — the Rust harness is not prova, so nothing marks it as nested the way
          # PROVA_RUN_DEPTH marks a prova spawned by prova — so under Actions every one of them
          # appended its own table to the job summary. This step reports through cargo's output;
          # the job summary belongs to the Proofs step below, which is a single top-level run.
          PROVA_GHA: "off"

      # Prova, proven by prova. This is a BLACK-BOX pass over the binary just built, so it covers
      # ground `cargo test` structurally cannot: manifest parsing, discovery, capability gating,
      # and the CLI's own surface as a user meets it. ~11s for ~180 proofs.
      #
      # All three platforms. Two platform-divergence bugs were diagnosed (not papered over) to get
      # here. macOS: proofs/http/probe_test.lua booted `python -m http.server`, whose server_bind()
      # calls socket.getfqdn() between bind() and listen() — ~70s reverse DNS on the GitHub macOS
      # runner left the port unreachable; the fixture now scripts a getfqdn-free server on a literal
      # IP. Windows: shell.spawn runs under `cmd /C`, which (unlike unix `sh -c`) does not
      # exec-replace, so a spawned service survived TerminateProcess as a grandchild holding the stdout
      # pipe open and wedged teardown; Process::stop() now tree-kills on Windows.
      #
      # Open specs report as the `spec` outcome and keep this green by design — that is the point
      # of the flag. A spec whose body starts passing fails here, demanding graduation.
      #
      # `cargo xtask proofs` builds prova-cli and runs the suite through `target/debug/prova`, so the
      # binary under proof is the one this commit produces — no install, and no dependence on the
      # Test step above having happened to leave a binary behind. It is the same command developers
      # run, so this gate cannot drift from the local loop.
      #
      # It replaced an `export PATH="$PWD/target/debug"` prelude. Nested runs now resolve through
      # `prova.bin` — the runtime hands each run its own executable — so the inner prova is the outer
      # one by construction rather than by arranging the environment correctly.
      - name: Proofs (prova, proven by prova)
        if: runner.os == 'Linux' || runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        run: cargo xtask proofs
